name: Release

on:
  push:
    branches: [main]
    paths:
      - js/version.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Read and validate application version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./js/version.js').APP_VERSION")"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION already points to $tagged_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
